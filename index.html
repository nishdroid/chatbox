            
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Connect Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark mode scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Smooth fade-in animation for modal */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-900 h-screen w-full flex items-center justify-center p-4 sm:p-8 font-sans text-slate-200">

    <!-- App Container -->
    <div class="bg-slate-800 w-full max-w-2xl h-full max-h-[800px] rounded-2xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-700">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-700 p-4 sm:p-5 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                <h1 class="text-xl font-bold tracking-wide text-white">Live Connect</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <span id="user-display" class="text-xs font-medium bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full hidden"></span>
                
                <!-- Share Button -->
                <button id="share-btn" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 p-2 rounded-full transition-colors" title="Invite a friend">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                </button>

                <!-- Info (?) Button -->
                <button id="info-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 p-2 rounded-full transition-colors" title="About">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- About Modal (Hidden by default) -->
        <div id="info-modal" class="hidden absolute inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full text-center shadow-2xl">
                <div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">Live Connect</h3>
                <p class="text-slate-400 mb-6">A simple chatting experience.</p>
                <div class="inline-block bg-slate-900 text-indigo-300 font-medium px-4 py-2 rounded-lg border border-slate-700 mb-6">
                    Made by Nishant
                </div>
                <button id="close-modal-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                    Awesome!
                </button>
            </div>
        </div>

        <!-- 1. Login / Username Screen -->
        <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-slate-800">
            <div class="w-20 h-20 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full flex items-center justify-center mb-6 shadow-[0_0_15px_rgba(99,102,241,0.1)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Join the Room</h2>
            <p class="text-slate-400 mb-8">Enter your display name to continue.</p>
            
            <div class="w-full max-w-xs space-y-4">
                <input type="text" id="username-input" placeholder="Your name..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                <button id="join-btn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md active:scale-[0.98]">
                    Start Chatting
                </button>
            </div>
        </div>

        <!-- 2. Chat Screen (Hidden initially) -->
        <div id="chat-screen" class="hidden flex-1 flex flex-col relative">
            
            <!-- Messages Area -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-4">
                <!-- Messages will be injected here -->
            </div>

            <!-- Upload Progress Indicator (Hidden) -->
            <div id="upload-status" class="hidden text-xs text-indigo-400 text-center py-1 bg-slate-900 border-t border-slate-700 animate-pulse">
                Processing image...
            </div>

            <!-- Input Area -->
            <div class="bg-slate-900 p-3 sm:p-4 border-t border-slate-700">
                <form id="message-form" class="flex gap-2 items-end">
                    
                    <!-- Hidden File Input -->
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    
                    <!-- Image Upload Button -->
                    <button type="button" id="img-btn" title="Send a Photo"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-indigo-400 border border-slate-700 rounded-full h-12 w-12 flex items-center justify-center flex-shrink-0 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </button>

                    <!-- Text Input -->
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off"
                        class="flex-1 px-4 py-3 bg-slate-800 text-white placeholder-slate-500 border border-slate-700 focus:bg-slate-900 focus:border-indigo-500 rounded-2xl focus:outline-none transition-colors h-12">
                    
                    <!-- Send Button -->
                    <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full h-12 w-12 flex items-center justify-center flex-shrink-0 transition-colors shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // I HAVE ADDED YOUR EXACT FIREBASE CREDENTIALS HERE!
        const firebaseConfig = {
            apiKey: "AIzaSyDW94FRfhEi03l-ItfbT2O6yy_nagWUXyQ",
            authDomain: "chatbox-23e3e.firebaseapp.com",
            databaseURL: "https://chatbox-23e3e-default-rtdb.firebaseio.com",
            projectId: "chatbox-23e3e",
            storageBucket: "chatbox-23e3e.firebasestorage.app",
            messagingSenderId: "433725707138",
            appId: "1:433725707138:web:28b4d710a7df87d5e2359b",
            measurementId: "G-PHWVZGX8RR"
        };

        let db, chatRef;
        let currentUsername = "";

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const userDisplay = document.getElementById('user-display');
        const shareBtn = document.getElementById('share-btn');
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        
        // New UI Elements
        const infoBtn = document.getElementById('info-btn');
        const infoModal = document.getElementById('info-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const imageInput = document.getElementById('image-input');
        const imgBtn = document.getElementById('img-btn');
        const uploadStatus = document.getElementById('upload-status');

        // --- Info Modal Logic ---
        infoBtn.addEventListener('click', () => {
            infoModal.classList.remove('hidden');
        });
        closeModalBtn.addEventListener('click', () => {
            infoModal.classList.add('hidden');
        });

        // --- Share Logic ---
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: 'Join my Live Chat!',
                text: 'Come chat with me on my new app!',
                url: window.location.href 
            };
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link copied to clipboard!");
                }
            } catch (err) { console.log('Error sharing:', err); }
        });

        // --- Login Logic ---
        function joinChat() {
            const name = usernameInput.value.trim();
            if (name.length > 0) {
                currentUsername = name;
                
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                chatScreen.classList.add('flex');
                
                userDisplay.textContent = currentUsername;
                userDisplay.classList.remove('hidden');
                shareBtn.classList.remove('hidden');

                initFirebase();
            } else {
                usernameInput.classList.add('border-red-500');
                setTimeout(() => usernameInput.classList.remove('border-red-500'), 500);
            }
        }

        joinBtn.addEventListener('click', joinChat);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        // --- Image Upload & Compression Logic ---
        imgBtn.addEventListener('click', () => {
            imageInput.click(); // Open file picker
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Show "Processing" text
            uploadStatus.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Compress the image before sending so it doesn't break Firebase
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Keep it small for mobile
                    let scaleSize = 1;
                    
                    if (img.width > MAX_WIDTH) {
                        scaleSize = MAX_WIDTH / img.width;
                    }
                    
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Convert to base64 string
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // 60% quality

                    // Push image to Firebase
                    push(chatRef, {
                        name: currentUsername,
                        text: '', // No text, just image
                        imageUrl: dataUrl,
                        timestamp: Date.now()
                    });

                    // Hide status and clear input
                    uploadStatus.classList.add('hidden');
                    imageInput.value = '';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // --- Firebase & Chat Logic ---
        function initFirebase() {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            chatRef = ref(db, 'messages');

            onChildAdded(chatRef, (snapshot) => {
                const messageData = snapshot.val();
                displayMessage(messageData.name, messageData.text, messageData.imageUrl, messageData.timestamp);
            });
        }

        // Send Text Message
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text && chatRef) {
                push(chatRef, {
                    name: currentUsername,
                    text: text,
                    imageUrl: null,
                    timestamp: Date.now() 
                });
                messageInput.value = '';
                messageInput.focus();
            }
        });

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function displayMessage(name, text, imageUrl, timestamp) {
            const isMe = name === currentUsername;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col max-w-[80%] sm:max-w-[70%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`;
            
            const nameSpan = isMe ? '' : `<span class="text-xs text-slate-400 ml-1 mb-1 font-medium">${name}</span>`;
            
            // Dark mode bubble colors
            const bubbleColors = isMe 
                ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-sm' 
                : 'bg-slate-700 text-slate-200 border border-slate-600 rounded-2xl rounded-tl-sm';

            const timeString = timestamp ? formatTime(timestamp) : '';
            const timeColor = isMe ? 'text-indigo-200' : 'text-slate-400';

            // HTML for Text or Image
            let contentHTML = '';
            if (imageUrl) {
                contentHTML = `<img src="${imageUrl}" class="rounded-lg mb-1 w-full max-w-[250px] border border-black/20" alt="Shared photo">`;
            }
            if (text) {
                contentHTML += `<p class="text-[15px] leading-relaxed break-words">${escapeHTML(text)}</p>`;
            }

            msgDiv.innerHTML = `
                ${nameSpan}
                <div class="${bubbleColors} px-4 py-2.5 shadow-sm relative group">
                    ${contentHTML}
                    <span class="text-[10px] ${timeColor} block mt-1 text-right">${timeString}</span>
                </div>
            `;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll down
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
